[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "compose-runner"
authors = [{name = "James Kent", email = "jamesdkent21@gmail.com"}]
description = "A package for running neurosynth-compose analyses"
readme = "README.md"
keywords = ["neurosynth-compose", "neurosynth", "neuroimaging", "meta-analysis"]
license = {text = "BSD 3-Clause License"} 
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]
dependencies = [
    # IBMA support needs the dependence handling and `groupby` argument, and the
    # runner reads a studyset's annotations off the studyset itself, which the
    # columnar rewrite (NiMARE #1103) introduced. All of it releases as NiMARE
    # 0.21.0. Replace with `nimare[parquet]>=0.21.0` once it is on PyPI, which
    # publishing this package requires anyway: PyPI rejects direct references.
    # The `parquet` extra is pyarrow, which reading a studyset release needs.
    #
    # This pin is now behind what the runner assumes. `docs/nimare-asks.md` 1-5
    # are implemented but unreleased, and the runner no longer works around
    # them: an unset `voxel_thresh` reaching a correction method is a TypeError
    # on 0.21.0rc3, and an empty or cancelling input is handled upstream or not
    # at all. Bump to the release that carries them before shipping.
    "nimare[parquet]==0.21.0rc3",
    "click",
    "requests",
    "sentry-sdk",
    "numpy",
    "neurostore-sdk>=1.1",
    "neurosynth-compose-sdk>=1.2",
]

[project.urls]
Repository = "https://github.com/neurostuff/compose-runner"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-recording",
    "vcrpy",
]
aws = [
    "boto3",
]

[project.scripts]
compose-run = "compose_runner.cli:cli"

# Required while `nimare` is a git direct reference. Remove with it.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "compose_runner/_version.py"

[tool.hatch.build]
exclude = [
  "/.*",
]

[tool.flake8]
max-line-length = "99"
