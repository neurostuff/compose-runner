[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "compose-runner"
authors = [{name = "James Kent", email = "jamesdkent21@gmail.com"}]
description = "A package for running neurosynth-compose analyses"
readme = "README.md"
keywords = ["neurosynth-compose", "neurosynth", "neuroimaging", "meta-analysis"]
license = {text = "BSD 3-Clause License"} 
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
]
dynamic = ["version"]
dependencies = [
    # Pointed at main until 0.21.0 is released. That release is where IBMA
    # dependence handling and the `groupby` estimator argument land, where
    # Stouffers loses `normalize_contrast_weights`, and where `aggressive_mask`
    # starts defaulting to False; PyPI still only has 0.20.0, which has none of
    # it. Swap back to `nimare>=0.21.0` once the release is out -- PyPI rejects
    # direct references, so publishing this package needs that first.
    "nimare @ git+https://github.com/neurostuff/NiMARE@main",
    "click",
    "requests",
    "sentry-sdk",
    "numpy",
    "neurostore-sdk>=1.1",
    "neurosynth-compose-sdk>=1.2",
]

[project.urls]
Repository = "https://github.com/neurostuff/compose-runner"

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-recording",
    "vcrpy",
]
aws = [
    "boto3",
]

[project.scripts]
compose-run = "compose_runner.cli:cli"

# Required while `nimare` is a git direct reference rather than a version.
# Remove along with that reference once NiMARE 0.21.0 is on PyPI.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "compose_runner/_version.py"

[tool.hatch.build]
exclude = [
  "/.*",
]

[tool.flake8]
max-line-length = "99"
